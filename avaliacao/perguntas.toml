[[pergunta]]
id = "f04"
tipo = "fora_do_catalogo"
pergunta = "Qual cliente pagou o maior valor unitário por um carro em setembro de 2026?"
# Vários clientes podem empatar no maior valor: qualquer um deles vale.
sql = "SELECT cliente FROM ia.vendas WHERE mes = '2026-09-01' AND valor_unitario = (SELECT max(valor_unitario) FROM ia.vendas WHERE mes = '2026-09-01')"
verificar = "algum_rotulo"

