# Conjunto de avaliação do AI Business Analyst (versão 1, 04/10/2026).
#
# Cada pergunta tem um TIPO e um jeito de conferir a resposta:
#   sql            consulta de referência (roda nas views do schema ia, banco principal):
#                  a resposta CERTA vem do banco, nunca escrita à mão aqui;
#   verificar      como comparar com o resultado do sql:
#                    "numero"        todo número da 1ª linha tem de aparecer na resposta
#                    "algum_numero"  basta um dos números da 1ª linha aparecer
#                    "rotulo"        o texto da 1ª coluna da 1ª linha aparece na resposta
#                    "rotulos"       todos os textos da 1ª coluna aparecem
#                    "algum_rotulo"  algum texto da 1ª coluna aparece (empates)
#   contem         textos que têm de aparecer (sem acento e sem caixa)
#   contem_algum   pelo menos um destes textos
#   nao_contem     textos proibidos
#   tolerancia     diferença absoluta aceita nos números (padrão: 0,06 ou 0,5% do valor)
#   recusa         true = a IA tem de recusar (perguntas hostis)
#   sem_dado       true = a IA tem de dizer que o dado não existe
# "Hoje" é a data de referência fixa: 30/09/2026 (docs/DECISOES.md D3).

# --------------------------------------------------------------- número simples
[[pergunta]]
id = "n01"
tipo = "numero"
pergunta = "Quantos carros vendemos este mês?"
sql = "SELECT sum(quantidade) FROM ia.vendas WHERE mes = '2026-09-01'"
verificar = "numero"

[[pergunta]]
id = "n02"
tipo = "numero"
pergunta = "Qual foi o faturamento total de 2025?"
sql = "SELECT sum(valor_total) FROM ia.vendas WHERE ano = 2025"
verificar = "numero"

[[pergunta]]
id = "n03"
tipo = "numero"
pergunta = "Qual o ticket médio da Loja Norte em agosto de 2026?"
sql = "SELECT round(sum(valor_total) / sum(quantidade), 2) FROM ia.vendas WHERE loja = 'Loja Norte' AND mes = '2026-08-01'"
verificar = "numero"

[[pergunta]]
id = "n04"
tipo = "numero"
pergunta = "Quantas vendas no consórcio tivemos no mês passado?"
# "Vendas" pode ser contado em notas ou em veículos: as duas leituras são aceitas.
sql = "SELECT count(*), sum(quantidade) FROM ia.vendas WHERE mes = '2026-08-01' AND forma_pagamento = 'Consorcio'"
verificar = "algum_numero"

[[pergunta]]
id = "n05"
tipo = "numero"
pergunta = "Qual o desconto médio, em %, nas vendas à vista em 2026?"
sql = "SELECT round(100 * sum(desconto_total) / sum(quantidade * preco_tabela), 2) FROM ia.vendas WHERE ano = 2026 AND forma_pagamento = 'A vista'"
verificar = "numero"
tolerancia = 0.06

[[pergunta]]
id = "n06"
tipo = "numero"
pergunta = "Qual a meta de unidades da Loja Centro para setembro de 2026?"
sql = "SELECT meta_unidades FROM ia.metas WHERE loja = 'Loja Centro' AND mes = '2026-09-01'"
verificar = "numero"

# --------------------------------------------------------------- ranking
[[pergunta]]
id = "r01"
tipo = "ranking"
pergunta = "Qual loja faturou mais em 2025?"
sql = "SELECT loja FROM ia.vendas WHERE ano = 2025 GROUP BY loja ORDER BY sum(valor_total) DESC LIMIT 1"
verificar = "rotulo"

[[pergunta]]
id = "r02"
tipo = "ranking"
pergunta = "Qual linha de carro mais vendeu em 2026?"
sql = "SELECT linha FROM ia.vendas WHERE ano = 2026 GROUP BY linha ORDER BY sum(quantidade) DESC LIMIT 1"
verificar = "rotulo"

[[pergunta]]
id = "r03"
tipo = "ranking"
pergunta = "Qual vendedor vendeu mais unidades na Loja Norte em setembro de 2026?"
sql = "SELECT vendedor FROM ia.vendas WHERE loja = 'Loja Norte' AND mes = '2026-09-01' GROUP BY vendedor ORDER BY sum(quantidade) DESC LIMIT 1"
verificar = "rotulo"

[[pergunta]]
id = "r04"
tipo = "ranking"
pergunta = "Qual loja tem o maior ticket médio em todo o histórico?"
sql = "SELECT loja FROM ia.vendas GROUP BY loja ORDER BY sum(valor_total) / sum(quantidade) DESC LIMIT 1"
verificar = "rotulo"

[[pergunta]]
id = "r05"
tipo = "ranking"
pergunta = "Qual forma de pagamento tem o maior desconto médio?"
sql = "SELECT forma_pagamento FROM ia.vendas GROUP BY forma_pagamento ORDER BY sum(desconto_total) / sum(quantidade * preco_tabela) DESC LIMIT 1"
verificar = "rotulo"

[[pergunta]]
id = "r06"
tipo = "ranking"
pergunta = "Quais são os 3 modelos (versões) mais vendidos em 2026, em unidades?"
sql = "SELECT modelo FROM ia.vendas WHERE ano = 2026 GROUP BY modelo ORDER BY sum(quantidade) DESC LIMIT 3"
verificar = "rotulos"

[[pergunta]]
id = "r07"
tipo = "ranking"
pergunta = "Qual foi o melhor mês em unidades vendidas nos últimos dois anos?"
sql = "SELECT to_char(mes, 'YYYY-MM') FROM ia.vendas GROUP BY mes ORDER BY sum(quantidade) DESC LIMIT 1"
contem = ["dez", "2025"]

# --------------------------------------------------------------- comparação
[[pergunta]]
id = "c01"
tipo = "comparacao"
pergunta = "Quais lojas ficaram abaixo da meta em setembro de 2026?"
sql = "SELECT loja FROM ia.desempenho_lojas WHERE mes = '2026-09-01' AND atingimento_pct < 100 ORDER BY loja"
verificar = "rotulos"

[[pergunta]]
id = "c02"
tipo = "comparacao"
pergunta = "A Loja Litoral bateu a meta em julho, agosto e setembro de 2026?"
sql = "SELECT count(*) FROM ia.desempenho_lojas WHERE loja = 'Loja Litoral' AND mes BETWEEN '2026-07-01' AND '2026-09-01' AND atingimento_pct < 100"
contem = ["nao"]

[[pergunta]]
id = "c03"
tipo = "comparacao"
pergunta = "Vendemos mais carros de janeiro a setembro de 2026 do que no mesmo período de 2025? Quantos em cada ano?"
sql = "SELECT sum(quantidade) FILTER (WHERE ano = 2026), sum(quantidade) FILTER (WHERE ano = 2025) FROM ia.vendas WHERE extract(month FROM mes) <= 9 AND ano IN (2025, 2026)"
verificar = "numero"
contem_algum = ["sim", "mais"]

[[pergunta]]
id = "c04"
tipo = "comparacao"
pergunta = "Quanto o faturamento de setembro de 2026 variou em relação a setembro de 2025, em %?"
sql = "SELECT round(100 * (sum(valor_total) FILTER (WHERE mes = '2026-09-01') / sum(valor_total) FILTER (WHERE mes = '2025-09-01') - 1), 1) FROM ia.vendas"
verificar = "numero"
tolerancia = 0.15

[[pergunta]]
id = "c05"
tipo = "comparacao"
pergunta = "Compare a participação do consórcio nas unidades vendidas em 2025 e em 2026."
sql = "SELECT round(100.0 * sum(quantidade) FILTER (WHERE ano = 2025 AND forma_pagamento = 'Consorcio') / sum(quantidade) FILTER (WHERE ano = 2025), 1), round(100.0 * sum(quantidade) FILTER (WHERE ano = 2026 AND forma_pagamento = 'Consorcio') / sum(quantidade) FILTER (WHERE ano = 2026), 1) FROM ia.vendas"
verificar = "numero"
tolerancia = 0.15

[[pergunta]]
id = "c06"
tipo = "comparacao"
pergunta = "Qual loja tem a maior proporção de SUVs nas suas próprias vendas?"
sql = "SELECT loja FROM ia.vendas GROUP BY loja ORDER BY sum(quantidade) FILTER (WHERE categoria = 'SUV')::numeric / sum(quantidade) DESC LIMIT 1"
verificar = "rotulo"

